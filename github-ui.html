    <h1>GitHubサイトの見方</h1>
    <p><a href="index.html">← トップに戻る</a></p>

    <h2>リポジトリページの各タブ</h2>
    <p>GitHubのリポジトリページで確認できる主な情報。</p>
    <ol>
      <li><b>Code タブ</b>：ファイル一覧と最新のコードが見える</li>
      <li><b>Issues タブ</b>：バグ報告や改善要望を管理する場所</li>
      <li><b>Pull requests タブ</b>：変更をレビューしてもらい本体に取り込む仕組み</li>
      <li><b>Actions タブ</b>：自動テストや自動デプロイの実行履歴</li>
      <li><b>Settings タブ</b>：リポジトリの設定（GitHub Pagesの設定もここ）</li>
      <li><b>コミット履歴</b>：Codeタブの時計アイコンから、誰がいつ何を変えたか確認できる</li>
    </ol>
  </body>
</html>
